<h1>Accounts</h1>
<h2>What it shows</h2>
<ul>
<li>One row per account, in the shared <a href="entities.html">Entities</a> layout.</li>
</ul>
<h2>Rules</h2>
<ul>
<li>A File counts for the account of its first leg that names one. A blacklisted service account is blanked, so a later leg&rsquo;s real account takes the File.</li>
<li>Each File counts for exactly one account.</li>
</ul>
