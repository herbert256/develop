<h1>Logins</h1>
<h2>What it shows</h2>
<ul>
<li>One row per login, in the shared <a href="entities.html">Entities</a> layout.</li>
</ul>
<h2>Rules</h2>
<ul>
<li>A login is named per leg: a File whose legs log two logins counts for both, so the rows can add up to more than the Files.</li>
<li>Error / OK is the File&rsquo;s outcome, never the logon&rsquo;s own success.</li>
</ul>
