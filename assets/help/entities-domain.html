<h1>Domains</h1>
<h2>What it shows</h2>
<ul>
<li>One row per business domain, in the shared <a href="entities.html">Entities</a> layout.</li>
</ul>
<h2>Rules</h2>
<ul>
<li>A domain is the first part of the logical name <code>domain_application_partner</code>; <code>input/logical_domains.txt</code> can replace it.</li>
<li>A File counts for one domain at most, so the rows never double-count.</li>
</ul>
